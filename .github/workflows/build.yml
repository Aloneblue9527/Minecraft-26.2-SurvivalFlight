name: Build SurvivalFlight
on:
  push:
    branches: ['**']
    tags: ['v1.0.0']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Compile and run regression checks
        run: ./gradlew clean build --no-daemon --console=plain
      - name: Inspect installable JAR and compute SHA-256
        run: |
          python3 tools/verify_jar.py
          mkdir -p build/release
          cp build/libs/survivalflight-26.2-1.0.0.jar build/libs/survivalflight-26.2-1.0.0-sources.jar build/release/
          cp build/distributions/SHA256SUMS build/distributions/jar-contents.txt build/release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SurvivalFlight-26.2-1.0.0
          path: build/release/
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref == 'refs/tags/v1.0.0'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SurvivalFlight-26.2-1.0.0
          path: dist
      - name: Verify artifact before release
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish experimental pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 --verify-tag --prerelease \
            --title "SurvivalFlight v1.0.0 — Experimental" \
            --notes-file RELEASE_NOTES.md \
            dist/survivalflight-26.2-1.0.0.jar \
            dist/survivalflight-26.2-1.0.0-sources.jar \
            dist/SHA256SUMS dist/jar-contents.txt
