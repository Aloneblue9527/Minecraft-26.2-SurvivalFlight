name: Build SurvivalFlight
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Read pinned Mod version
        id: version
        run: echo "value=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: Compile and run regression checks
        run: ./gradlew clean build --no-daemon --console=plain
      - name: Inspect installable JAR and compute SHA-256
        run: |
          python3 tools/verify_jar.py
          mkdir -p build/release
          cp build/libs/survivalflight-26.2-${{ steps.version.outputs.value }}.jar build/libs/survivalflight-26.2-${{ steps.version.outputs.value }}-sources.jar build/release/
          cp build/distributions/SHA256SUMS build/distributions/jar-contents.txt build/release/
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: SurvivalFlight-${{ github.sha }}
          path: build/release/
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: SurvivalFlight-${{ github.sha }}
          path: dist
      - name: Check tag matches pinned version
        run: test "$GITHUB_REF_NAME" = "v$(sed -n 's/^mod_version=//p' gradle.properties)"
      - name: Verify artifact before release
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish experimental pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "SurvivalFlight $GITHUB_REF_NAME — Experimental" \
            --notes-file RELEASE_NOTES.md \
            dist/survivalflight-26.2-*.jar \
            dist/SHA256SUMS dist/jar-contents.txt
