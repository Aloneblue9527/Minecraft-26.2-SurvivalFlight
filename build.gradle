plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = '1.0.0'
group = 'dev.survivalflight'
base { archivesName = 'survivalflight-26.2' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.named('jar') { from('LICENSE') }

// Dependency-free regression checks. Never packaged into the installable JAR.
sourceSets {
    sessionTest {
        java.srcDir 'src/sessionTest/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('flightSessionTest', JavaExec) {
    dependsOn tasks.named('sessionTestClasses')
    classpath = sourceSets.sessionTest.runtimeClasspath
    mainClass = 'dev.survivalflight.FlightSessionTest'
}
tasks.named('check') { dependsOn tasks.named('flightSessionTest') }
