plugins { id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' }
version = '1.0.0'
group = 'dev.survivalflight'
base { archivesName = 'survivalflight-26.2' }
repositories { mavenCentral(); maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.2+26.2'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
tasks.named('jar') { from('LICENSE') }
